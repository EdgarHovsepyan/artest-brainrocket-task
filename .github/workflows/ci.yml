name: CI

# Wave 1 of the integration strategy (see games/ARCHITECTURE-STRATEGY.md):
# the "tools pipeline" gate. Every push/PR re-certifies that the pure core is
# correct AND that the economy hasn't drifted — the same checks that let us
# reason about RTP at all run automatically, on both engines' shared math.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · format · test · sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build + unit tests (both engines + math-core)
        run: pnpm test

      - name: RTP simulation (economy guard)
        run: pnpm sim
