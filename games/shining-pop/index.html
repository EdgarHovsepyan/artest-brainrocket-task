<!doctype html>
<!-- SHINING POP · PixiJS v8 edition — single-file, no build step.
     A 5x3, 10-payline crystal-gem slot in the classic fruit-machine style.
     Forked from wheelie-pop-pixi.html — Stake Engine RGS contract, replay,
     social filter, jurisdiction compliance and HUD are carried over; the
     wheel mechanic is replaced by reel-strip slot logic.
     Math model: see shining-crown-sim.js — base RTP 96.02% (20M-spin sim).
     Zero external resources: PixiJS bundled at vendor/pixi.min.js, fonts
     bundled at assets/fonts/*.woff2 (Stake constraint #7 / XSS policy). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a0810">
<meta name="description" content="Shining Pop — a 5x3, 10-payline crystal-gem slot with three free-spins bonus modes and a 5,000x max win.">

<!-- HARD CACHE-BUST (2026-05-30): force the browser to re-fetch the game on
     EVERY load so you always see the latest build - kills the "old version"
     ghost even on a plain reload. Remove/relax before Stake submission. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ARTEST | BrainRocket — Shining Pop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a0a1e'/%3E%3Cpath d='M6 22l2-11 5 5 3-7 3 7 5-5 2 11z' fill='%23ffd24a'/%3E%3Crect x='6' y='22' width='20' height='3.4' rx='1' fill='%23e0497f'/%3E%3C/svg%3E">
<script>
  /* DEV BUILD STAMP — auto-hidden in production (P0-A). Confirms at a glance
     you're on the LATEST code, not a cached page. Bumped every change. After a
     HARD refresh (Ctrl+Shift+R) the bottom-left tag must read the build letter
     below; if it doesn't, your page is stale (or you opened dist/index.html or
     the STAKE-BUILDS copy by mistake — those are NOT this file).
     The corner div renders ONLY on localhost / 127.0.0.1 / file:// / ?debug=true,
     so it never ships to Stake even if the script is left in. */
  window.__BUILD__ = '2026-06-04 · build BS';
  addEventListener('DOMContentLoaded', () => {
    var dev = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
           || location.protocol === 'file:' || /[?&]debug=/.test(location.search);
    if(!dev) return;
    const d = document.createElement('div');
    d.textContent = 'SHINING ' + window.__BUILD__;
    d.style.cssText = 'position:fixed;left:7px;bottom:5px;z-index:99999;font:9px/1 ui-monospace,monospace;color:rgba(255,90,156,.42);pointer-events:none;letter-spacing:.5px';
    document.body.appendChild(d);
  });
</script>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400 700;font-display:swap;src:url(assets/fonts/fredoka-latin.woff2) format('woff2')}
@font-face{font-family:'Luckiest Guy';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/luckiestguy-latin.woff2) format('woff2')}
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
html,body{margin:0;height:100%;background:#0a0610;overflow:hidden;
  font-family:'Fredoka',sans-serif;-webkit-tap-highlight-color:transparent;
  user-select:none;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center}
/* AMBIENT WORLD-BLEED — on windows wider/taller than the 1200x675 game, fill
   the letterbox with a blurred, darkened cathedral so there are NO flat-black
   "empty" bands. On Stake the game is in a 1200x675 iframe (no letterbox); this
   just makes standalone / wide-window viewing look premium. (2026-05-30) */
body::before{content:'';position:fixed;inset:-5%;z-index:-1;
  background:#0a0610 center/cover no-repeat url('assets/images/bg.jpg');
  filter:blur(38px) brightness(0.38) saturate(1.18);transform:scale(1.14)}
/* MAX-SIZE LETTERBOX — matches Stake iframe (Desktop 1200x675).
   On mobile (≤900 wide) canvas fills the viewport edge-to-edge.
   On desktop / wide windows it letterboxes inside a centred 1200x675
   frame so the game doesn't scale up to absurd sizes and push the
   bottom bar off screen. This is what Stake's own players see. */
canvas{display:block;
  width:min(100vw, var(--game-w, 1200px));
  height:min(100vh, var(--game-h, 675px));
  max-width:100vw;max-height:100vh}
@media (max-aspect-ratio: 1/1){
  /* Portrait — let canvas fill the viewport (mobile playstyle) */
  canvas{width:100vw;height:100vh}
}
/* ── EXTRA STUDIO frame — stage 1 boot (HTML loader) ──
   Pure black backdrop, breathing studio logo + ELEGANT branded progress
   bar with gradient fill + shine sweep. Web-animations methodology:
   gradient that reads as a real progress indicator (track at 12% alpha,
   fill in neon-magenta with chromatic top highlight + soft glow halo),
   "LOADING" caption at 75% opacity for clean read. Mimics A24 / Annapurna
   studio idents but with a visible branded progress system. */
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  /* Show the GAME candy background on the loader (was a flat black radial). The
     dark gradient overlay keeps the logo + progress bar readable over it; #0a0610
     is the fallback colour shown until bg.jpg decodes. */
  background:linear-gradient(180deg,rgba(8,4,14,.26) 0%,rgba(8,4,14,.40) 55%,rgba(8,4,14,.70) 100%),#0a0610 center/cover no-repeat url('assets/images/bg.jpg');
  transition:opacity .42s cubic-bezier(.16,1,.3,1)}
#loader.gone{opacity:0;pointer-events:none}
#loader .lwrap{position:relative;display:flex;flex-direction:column;
  align-items:center;gap:34px;
  /* Beat 1 — soft branded arrival (web-animations: ease-out entrance) */
  animation:lin .6s cubic-bezier(.16,1,.3,1) both}
#loader .llogo{width:min(70vw,420px);max-height:50vh;object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));
  animation:lbreathe 2.6s ease-in-out infinite}
/* ── EXTRA STUDIO frame — studio img + PROGRESS BAR (2026-05-30 user
   redesign: "studio EXTRA img loading ONLY with progress; remove the
   game-logo loader"). The HTML #loader is now the SOLE loading screen;
   the branded Pixi popLoader (game logo) is skipped at the call site. */
#loader .lgroup{display:flex;flex-direction:column;align-items:center;gap:13px}
#loader .lbar{position:relative;display:block;width:min(62vw,300px);height:5px;border-radius:3px;
  background:rgba(255,255,255,.10);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,0,127,.20)}
#loader .lfill{height:100%;width:0;border-radius:3px;position:relative;z-index:1;
  background:linear-gradient(90deg,#ff007f,#ff5a9c,#ffce47);
  box-shadow:0 0 10px rgba(255,0,127,.55);
  /* Beat 2 — ease real Assets.load() jumps so the bar glides, never stutters */
  transition:width .35s cubic-bezier(.16,1,.3,1)}
/* Beat 2 — perpetual shine sweep across the track = "alive while loading" */
#loader .lshine{position:absolute;top:0;left:0;height:100%;width:38%;z-index:2;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:lscan 1.5s ease-in-out infinite}
#loader .lp{display:block;font:600 11px/1 'Fredoka',system-ui,sans-serif;
  letter-spacing:3px;color:rgba(255,255,255,.5);text-transform:uppercase}
@keyframes lbreathe{0%,100%{transform:scale(1);opacity:.94}50%{transform:scale(1.035);opacity:1}}
@keyframes lscan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes lin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #loader .lwrap{animation:none}
  #loader .lshine{animation:none;opacity:0}
  #loader .llogo{animation:none}
}
@keyframes ldotpulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
<!-- Pre-game loader — EXTRA STUDIO frame shown while PIXI assets load.
     Stage 1 of 2: pure black bg + breathing studio logo. The bar +
     "LOADING" caption are intentionally subtle (4% track, .45 opacity)
     so the logo dominates — classic studio-ident aesthetic (A24, Annapurna).
     Stage 2 (game-brand loader with gradient bg + premium typography) is
     rendered by the Pixi popLoader container after this fades out. -->
<main aria-label="Shining Pop slot game">
<div id="loader">
  <div class="lwrap">
    <!-- The GAME's own logo, centred + responsive (.llogo: min(70vw,420px),
         max-height 50vh, contain). Uses logo-loader.png (the logo.jpg black bg keyed
         out to transparent) + a drop-shadow so it reads cleanly over the candy-bg
         loader — screen-blend only worked on the old flat-black loader. -->
    <img class="llogo" src="assets/images/logo-loader.png" alt="Shining Pop" />
    <div class="lgroup">
      <div class="lbar"><div class="lfill" id="lfill"></div><i class="lshine"></i></div>
      <div class="lp" id="lprog">LOADING</div>
    </div>
  </div>
</div>
</main>
  <!-- Vite entry: npm PixiJS re-exposed as a global, then the ported game (wrapper-first) -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
