<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>SHINING POP V2 — ARTEST | BrainRocket</title>

  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">

  <link rel="stylesheet" type="text/css" href="style.css"/>
  <style>
    /* ROOT BG — the canonical game-bg color. Without this, the browser's default
       white shows through ANY frame the Cocos canvas hasn't repainted (intro
       fade-out + first-paint gap + occasional throttled-tab re-rasterisation).
       Setting it here means there is NEVER a white frame, period — independent
       of what the engine is doing. (2026-06-11: the recurring "white flash after
       intro hides" bug — fixed at the right layer this time.) */
    html, body { background-color: #0a0610; margin: 0; padding: 0; }
    #GameDiv, #Cocos3dGameContainer, #GameCanvas { background-color: #0a0610; }

    /* ===== CINEMATIC CANDY BOOT LOADER (genuine redesign, 2026-06-25) =========
       Premium candy boot, layered: the real candy world (blurred, slow drift) +
       a warm candy glow + drifting candy SPRINKLES (on-theme — replaces the old
       generic rotating rays) + a pink halo, a SHIMMER sweep masked across the
       logo, a liquid-candy POUR progress (glass channel, flowing candy-cane fill,
       gloss sheen + a bright wet meniscus at the pour edge + scan), and a 100% POP
       + bloom before the fade hands off to the game. Progress is REAL (reads cc
       boot stages, JS below). Reduced-motion calms every loop. Owner direction
       kept: "material being poured" + real-bg context boot. */
    @font-face{font-family:'Fredoka';font-style:normal;font-display:swap;
      src:url('loader/Fredoka.ttf') format('truetype')}
    #brandLoader{position:fixed;inset:0;z-index:999;background:#0a0610;
      transition:opacity .5s cubic-bezier(.16,1,.3,1);overflow:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Fredoka',system-ui,sans-serif}
    #brandLoader.gone{opacity:0;pointer-events:none}
    /* real candy world, dark wash + blur — context-aware boot */
    #brandLoader .bg{position:absolute;inset:-8%;
      background:url('loader/bg.jpg') center/cover no-repeat;
      filter:blur(13px) brightness(.5) saturate(1.18);transform:scale(1.06);
      animation:bl-drift 19s ease-in-out infinite}
    /* warm candy radial glow + soft vignette for depth */
    #brandLoader .glow{position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse 72% 56% at 50% 44%,rgba(255,0,127,.15),transparent 56%),
        radial-gradient(ellipse 92% 74% at 50% 50%,transparent 50%,rgba(4,2,8,.84) 100%)}
    /* drifting candy sprinkles (additive, on-theme) */
    #brandLoader .sprinkles{position:absolute;inset:0;pointer-events:none;
      mix-blend-mode:screen;overflow:hidden}
    #brandLoader .sprinkles i{position:absolute;bottom:-7%;left:var(--x);
      width:var(--s);height:var(--s);border-radius:50%;opacity:0;
      background:radial-gradient(circle at 36% 30%,#fff 0%,var(--c) 55%,transparent 72%);
      filter:drop-shadow(0 0 6px var(--c));
      animation:bl-float var(--d) linear var(--dl) infinite}
    /* pink halo behind the logo */
    #brandLoader .halo{position:absolute;top:42%;left:50%;
      width:min(560px,74vw);height:min(420px,56vw);transform:translate(-50%,-50%);
      pointer-events:none;mix-blend-mode:screen;
      background:radial-gradient(ellipse,rgba(255,0,127,.34) 0%,rgba(255,90,156,.18) 32%,transparent 66%);
      animation:bl-halo 3.2s ease-in-out infinite}
    /* the REAL logo + a shimmer sweep masked to the art */
    #brandLoader .logowrap{position:relative;width:min(384px,60vw);
      animation:bl-breathe 2.8s ease-in-out infinite}
    #brandLoader .logo{display:block;width:100%;height:auto;
      filter:drop-shadow(0 7px 26px rgba(0,0,0,.55))}
    #brandLoader .shine{position:absolute;inset:0;pointer-events:none;
      -webkit-mask:url('loader/logo.png') center/contain no-repeat;
              mask:url('loader/logo.png') center/contain no-repeat;
      background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.72) 50%,transparent 58%);
      background-size:260% 100%;background-position:200% 0;mix-blend-mode:screen;
      animation:bl-shimmer 4.2s ease-in-out 1s infinite}
    /* bar stack */
    #brandLoader .barwrap{position:relative;margin-top:36px;display:flex;
      flex-direction:column;align-items:center;gap:13px;z-index:2}
    /* PROGRESS — liquid candy POUR: glass channel + candy-cane fill that flows,
       a glossy top sheen, a bright WET meniscus at the leading edge, and a scan. */
    #brandLoader .bbar{position:relative;width:min(66vw,330px);height:13px;
      border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden;
      box-shadow:inset 0 1px 3px rgba(0,0,0,.6),
        inset 0 0 0 1px rgba(255,0,127,.22),
        0 0 30px rgba(255,0,127,.16)}
    #brandLoader .bfill{position:absolute;left:0;top:0;height:100%;width:4%;
      border-radius:8px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.04) 44%,rgba(0,0,0,.14) 100%),
        repeating-linear-gradient(115deg,
          rgba(255,255,255,.40) 0 9px, rgba(255,255,255,0) 9px 22px),
        linear-gradient(90deg,#ff007f 0%,#ff5a9c 52%,#ffce47 100%);
      background-size:auto, 44px 100%, auto;
      box-shadow:0 0 18px rgba(255,0,127,.70), 0 0 6px rgba(255,206,71,.5);
      transition:width .4s cubic-bezier(.16,1,.3,1);
      animation:bl-flow 1.05s linear infinite}
    /* bright wet meniscus at the pour's leading edge */
    #brandLoader .bfill::after{content:'';position:absolute;top:0;right:0;
      width:11px;height:100%;border-radius:7px;transform-origin:right;
      background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.92));
      box-shadow:0 0 14px rgba(255,206,71,.9);
      animation:bl-bead 1.05s ease-in-out infinite}
    #brandLoader .bshine{position:absolute;top:0;left:0;height:100%;width:40%;
      pointer-events:none;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
      animation:bl-scan 1.5s ease-in-out infinite}
    #brandLoader .cap{display:flex;align-items:baseline;gap:9px;
      font:600 12px/1 'Fredoka',system-ui,sans-serif;
      letter-spacing:8px;color:rgba(245,247,250,.66);text-transform:uppercase}
    #brandLoader .cap .pct{font-size:13px;letter-spacing:1px;color:#ff5a9c;
      font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
    #brandLoader .brand{position:absolute;bottom:32px;left:0;right:0;text-align:center;
      font:600 10px/1 'Fredoka',system-ui,sans-serif;letter-spacing:4px;
      color:rgba(245,247,250,.35)}
    /* 100% completion bloom + logo pop (one-shot, added via .ready) */
    #brandLoader .flash{position:absolute;inset:0;pointer-events:none;opacity:0;
      background:radial-gradient(ellipse 60% 46% at 50% 44%,rgba(255,255,255,.9),
        rgba(255,0,127,.4) 40%,transparent 70%);mix-blend-mode:screen}
    #brandLoader.ready .flash{animation:bl-flash .55s ease-out both}
    #brandLoader.ready .logowrap{animation:bl-pop .55s cubic-bezier(.2,1.5,.3,1) both}
    #brandLoader.ready .bfill{animation:none}
    @keyframes bl-drift{0%,100%{transform:scale(1.06) translate(0,0)}
      50%{transform:scale(1.09) translate(-1.2%,-1%)}}
    @keyframes bl-breathe{0%,100%{transform:scale(1) translateY(0)}
      50%{transform:scale(1.025) translateY(-3px)}}
    @keyframes bl-halo{0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(1)}
      50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
    @keyframes bl-shimmer{0%{background-position:200% 0}
      55%,100%{background-position:-120% 0}}
    @keyframes bl-float{0%{opacity:0;transform:translateY(0) translateX(0)}
      12%{opacity:.9}88%{opacity:.65}
      100%{opacity:0;transform:translateY(-118vh) translateX(var(--xd,12px))}}
    @keyframes bl-flow{to{background-position:0 0, 44px 0, 0 0}}
    @keyframes bl-bead{0%,100%{opacity:.85;transform:scaleX(1)}
      50%{opacity:1;transform:scaleX(1.3)}}
    @keyframes bl-scan{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
    @keyframes bl-pop{0%{transform:scale(1)}40%{transform:scale(1.07)}
      100%{transform:scale(1)}}
    @keyframes bl-flash{0%{opacity:0;transform:scale(.96)}
      30%{opacity:.85}100%{opacity:0;transform:scale(1.04)}}
    @media (prefers-reduced-motion:reduce){
      #brandLoader .logowrap,#brandLoader .halo,#brandLoader .sprinkles i,
      #brandLoader .shine,#brandLoader .bshine,#brandLoader .bfill,
      #brandLoader .bfill::after,#brandLoader .bg{animation:none}
      #brandLoader.ready .logowrap,#brandLoader.ready .flash{animation:none}
    }
  </style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  <div id="brandLoader">
    <div class="bg"></div>
    <div class="sprinkles">
      <i style="--s:7px;--x:9%;--c:#ff5a9c;--d:11s;--dl:-2s;--xd:14px"></i>
      <i style="--s:5px;--x:20%;--c:#ffce47;--d:13s;--dl:-7s;--xd:-10px"></i>
      <i style="--s:8px;--x:31%;--c:#b86fda;--d:10s;--dl:-4s;--xd:18px"></i>
      <i style="--s:6px;--x:43%;--c:#6fe0c8;--d:14s;--dl:-9s;--xd:-8px"></i>
      <i style="--s:9px;--x:54%;--c:#ff5a9c;--d:12s;--dl:-1s;--xd:12px"></i>
      <i style="--s:5px;--x:64%;--c:#ffce47;--d:15s;--dl:-6s;--xd:-16px"></i>
      <i style="--s:7px;--x:74%;--c:#b86fda;--d:11s;--dl:-10s;--xd:10px"></i>
      <i style="--s:6px;--x:85%;--c:#ff007f;--d:13s;--dl:-3s;--xd:-12px"></i>
      <i style="--s:8px;--x:92%;--c:#6fe0c8;--d:10s;--dl:-8s;--xd:14px"></i>
      <i style="--s:5px;--x:15%;--c:#b86fda;--d:14s;--dl:-12s;--xd:-9px"></i>
      <i style="--s:7px;--x:38%;--c:#ffce47;--d:12s;--dl:-5s;--xd:16px"></i>
      <i style="--s:6px;--x:60%;--c:#ff5a9c;--d:15s;--dl:-11s;--xd:-14px"></i>
      <i style="--s:8px;--x:80%;--c:#6fe0c8;--d:11s;--dl:-2s;--xd:9px"></i>
      <i style="--s:5px;--x:48%;--c:#ff007f;--d:13s;--dl:-9s;--xd:-11px"></i>
    </div>
    <div class="glow"></div>
    <div class="halo"></div>
    <div class="logowrap">
      <img class="logo" src="loader/logo.png" alt="Shining Pop V2"/>
      <i class="shine"></i>
    </div>
    <div class="barwrap">
      <div class="bbar"><div class="bfill"></div><i class="bshine"></i></div>
      <span class="cap">LOADING<em class="pct">0%</em></span>
    </div>
    <div class="brand">AN ARTEST | BRAINROCKET PRODUCTION</div>
    <div class="flash"></div>
  </div>
  <script>
    /* Branded boot loader — READ-ONLY progress (no engine monkey-patch). Reads
       cc boot stages (loaded / inited / scene-up) and EASES the bar toward each
       stage target so it feels continuous, not a hard staircase. The earlier
       cc.assetManager.loadAny override was removed: patching a core engine method
       during boot risked the asset pipeline (and a console error). */
    (function () {
      var t0 = Date.now();
      var fill = null;
      var pctEl = null;
      var shown = 4;
      var setW = function (pct) {
        if (!fill) fill = document.querySelector('#brandLoader .bfill');
        if (!pctEl) pctEl = document.querySelector('#brandLoader .pct');
        if (fill) fill.style.width = pct.toFixed(1) + '%';
        if (pctEl) pctEl.textContent = Math.round(pct) + '%';
      };
      var iv = setInterval(function () {
        var stage = 0;
        try {
          if (window.cc) stage = 1;
          if (window.cc && window.cc.game && window.cc.game.inited) stage = 2;
          if (window.cc && window.cc.director && window.cc.director.getScene()) stage = 3;
          if (window.__shiningPopReady) stage = 4;
        } catch (e) { stage = 0; }
        // Stage 3 (empty scene up) caps at 92% — the game still has to load its
        // assets and build the intro. Only the real ready signal (stage 4, set by
        // the controller right after buildIntro) fills to 100 and lets the loader
        // hide, so there is NO black gap between the scene mounting and the intro.
        var target = [8, 34, 70, 92, 100][stage];
        // ease toward the stage target → smooth fill (CSS width-transition adds
        // the final polish); never jumps backward.
        shown += (target - shown) * 0.16;
        setW(shown);
        if ((window.__shiningPopReady && shown > 99.3) || Date.now() - t0 > 30000) {
          clearInterval(iv);
          setW(100);
          var el = document.getElementById('brandLoader');
          if (el) {
            el.classList.add('ready'); // 100% bloom + logo pop, then hand off
            setTimeout(function () {
              el.classList.add('gone');
              setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 600);
            }, 520);
          }
        }
      }, 60);
    })();
  </script>

  <script>
    /* RESPONSIVE CANVAS KICK. The engine sizes the frame from window.innerWidth
       captured at BOOT and only refreshes on a real 'resize' event. In an embed /
       automated viewport / late-settling layout that first measure can be stale
       (tiny innerWidth), freezing the canvas at a small size in the top-left. A
       no-op resize re-runs the engine's _resizeFrame against the now-correct
       viewport — safe + idempotent, and it hardens real browsers too. */
    (function () {
      function kick() { try { window.dispatchEvent(new Event('resize')); } catch (e) {} }
      // Kick on load + the next two frames (covers late layout settle)...
      window.addEventListener('load', function () {
        requestAnimationFrame(function () { kick(); requestAnimationFrame(kick); });
      });
      // ...and exactly ONCE more when the engine reports the scene is up, then stop.
      // (Deliberately NOT a long interval — repeatedly re-laying a full-size canvas
      // hammers throttled/headless renderers for no benefit.)
      var poll = setInterval(function () {
        if (window.cc && cc.director && cc.director.getScene()) { kick(); clearInterval(poll); }
      }, 120);
      setTimeout(function () { clearInterval(poll); }, 6000); // safety stop
    })();
  </script>
  <script>
    /* CRISPER RENDER (owner: "4K / device pixel ratio 3+"). Cocos 3.8.8 hard-caps
       the backing-store DPR at min(devicePixelRatio, 2) via a read-only getter, so
       3x phones render at 2x and the browser upscales the rest (the softness). The
       supported lever is cc.screen.resolutionScale, which multiplies the framebuffer
       (effective DPR = min(dpr,2) x resolutionScale) and feeds the custom pipeline +
       all .effect shaders. We raise it to 1.25 (effective DPR 2.5) on capable
       devices only — cost is QUADRATIC, so it's GPU-gated + capped to protect 60fps
       on the multi-shader win ceremony. Reversible: ?crisp=1 forces it off; deleting
       this block returns the build to stock. */
    (function () {
      function tier() {
        try {
          var dpr = window.devicePixelRatio || 1;
          if (dpr <= 1.0) return 1; // desktop @1x: nothing to gain
          var weak = false;
          try {
            var gl = document.createElement('canvas').getContext('webgl');
            var dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
            var r = dbg ? ('' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)).toLowerCase() : '';
            weak = /mali-4|adreno [23]|powervr|swiftshader|llvmpipe|software/.test(r);
          } catch (e) {}
          if (weak) return 1; // protect low-end GPUs
          var longEdge = Math.max(window.innerWidth, window.innerHeight) * dpr;
          if (longEdge > 3400) return 1.15; // huge panels: cap fill-rate harder
          return 1.25; // effective DPR = 2 x 1.25 = 2.5
        } catch (e) { return 1; }
      }
      function apply() {
        try {
          if (!(window.cc && cc.screen && typeof cc.screen.resolutionScale !== 'undefined')) return;
          var m = /[?&]crisp=([0-9.]+)/.exec(location.search);
          var s = m ? parseFloat(m[1]) : tier();
          if (s && s !== 1) cc.screen.resolutionScale = s;
        } catch (e) {}
      }
      var p = setInterval(function () {
        if (window.cc && cc.director && cc.director.getScene()) { apply(); clearInterval(p); }
      }, 120);
      setTimeout(function () { clearInterval(p); }, 6000);
    })();
  </script>
